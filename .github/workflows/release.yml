name: Release engine and documentation

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      toolchain: ${{ steps.toolchain.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Detect release commit and generate changelog
        id: version
        run: python scripts/release.py prepare
      # Resolve the repository's nightly once so all platforms use the same compiler.
      - name: Resolve Rust toolchain
        if: steps.version.outputs.tag != ''
        id: toolchain
        shell: bash
        run: |
          toolchain=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustup show active-toolchain
          version=$(python -c 'import pathlib, subprocess, tomllib; root = pathlib.Path(subprocess.check_output(["rustc", "--print", "sysroot"], text=True).strip()); manifest = tomllib.loads((root / "lib/rustlib/multirust-channel-manifest.toml").read_text()); print("nightly-" + manifest["date"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.tag != ''
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev mold pkg-config libspeechd-dev libdbus-1-dev libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev autoconf2.13 yasm
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '20.1'
          directory: ${{ runner.temp }}/llvm
          env: true
      - name: Configure Linux bindgen
        if: runner.os == 'Linux'
        run: echo "LIBCLANG_PATH=$LLVM_PATH/lib" >> "$GITHUB_ENV"
      - name: Configure Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" >> $env:GITHUB_ENV
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\moztools" | Out-Null
          Invoke-WebRequest https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip -OutFile "$env:RUNNER_TEMP\moztools.zip"
          Expand-Archive "$env:RUNNER_TEMP\moztools.zip" "$env:RUNNER_TEMP\moztools"
          "MOZTOOLS_PATH=$env:RUNNER_TEMP\moztools\moztools-4.0" >> $env:GITHUB_ENV
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # Downloads remain reusable when nightly changes; compiled outputs do not.
      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-deps-v1-${{ matrix.platform }}-
      - name: Cache Rust desktop and Android build outputs
        uses: actions/cache@v5
        with:
          path: target
          key: rust-build-v1-${{ matrix.platform }}-${{ needs.prepare.outputs.toolchain }}-${{ hashFiles('.cargo/config.toml', 'scripts/build-dist.py', '.github/workflows/release.yml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-build-v1-${{ matrix.platform }}-${{ needs.prepare.outputs.toolchain }}-${{ hashFiles('.cargo/config.toml', 'scripts/build-dist.py', '.github/workflows/release.yml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            rust-build-v1-${{ matrix.platform }}-${{ needs.prepare.outputs.toolchain }}-${{ hashFiles('.cargo/config.toml', 'scripts/build-dist.py', '.github/workflows/release.yml') }}-
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Locate Android SDK
        if: runner.os == 'Linux'
        id: android-sdk
        run: echo "path=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Cache Android SDK and NDK packages
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.android-sdk.outputs.path }}/platforms/android-36
            ${{ steps.android-sdk.outputs.path }}/build-tools/36.0.0
            ${{ steps.android-sdk.outputs.path }}/ndk/30.0.16248370
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-api36-build36.0.0-ndk30.0.16248370
      - uses: android-actions/setup-android@v4
        if: runner.os == 'Linux'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'
      - name: Install Android native build tools
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo-ndk/bin" >> "$GITHUB_PATH"
      - name: Cache cargo-ndk
        if: runner.os == 'Linux'
        id: cargo-ndk
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cargo-ndk
          key: cargo-ndk-v1-${{ runner.os }}-${{ runner.arch }}-4.1.2
      - name: Install cargo-ndk on cache miss
        if: runner.os == 'Linux' && steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked --root "$RUNNER_TEMP/cargo-ndk"
      - name: Set distribution version
        shell: bash
        run: python scripts/release.py stamp "$RELEASE_TAG"
      - name: Build Linux and Android distributions
        if: runner.os == 'Linux'
        run: python scripts/build-dist.py --android --android-abi arm64-v8a --android-abi x86_64
      - name: Build Windows distribution
        if: runner.os == 'Windows'
        run: python scripts/build-dist.py
      - name: Verify archive compression and validation
        run: cargo test --locked -p deflorta-cli --bin deflorta pack::tests
      - name: Include Windows C++ runtime libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:VCToolsRedistDir 'x64\Microsoft.VC143.CRT'
          if (!(Test-Path $runtime)) { throw "MSVC redistributable directory is missing: $runtime" }
          foreach ($destination in @('dist', 'dist/target/windows-x86_64/debug', 'dist/target/windows-x86_64/release')) {
            Copy-Item "$runtime\*.dll" $destination
          }
      - name: Verify desktop exports
        shell: bash
        run: |
          cli=dist/deflorta
          if [ "$RUNNER_OS" = Windows ]; then cli=dist/deflorta.exe; fi
          test "$("$cli" --version)" = "deflorta ${RELEASE_TAG#v}"
          "$cli" create smoke-game
          "$cli" check smoke-game
          "$cli" publish smoke-game
          "$cli" publish smoke-game --debug -o smoke-game/dist/debug-export
      - name: Verify Android APK and release bundle exports
        if: runner.os == 'Linux'
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=true
          DEFLORTA_KEYSTORE: ${{ runner.temp }}/smoke.jks
          DEFLORTA_KEYSTORE_PASSWORD: smoke-test
          DEFLORTA_KEY_ALIAS: smoke
          DEFLORTA_KEY_PASSWORD: smoke-test
        run: |
          keytool -genkeypair -keystore "$DEFLORTA_KEYSTORE" -storepass "$DEFLORTA_KEYSTORE_PASSWORD" -keypass "$DEFLORTA_KEY_PASSWORD" -alias "$DEFLORTA_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI export test'
          for platform in android-aarch64 android-x86_64; do
            dist/deflorta publish smoke-game --platform "$platform" --debug --android-package org.deflorta.smoke
            dist/deflorta publish smoke-game --platform "$platform" --android-format aab --android-package org.deflorta.smoke
          done
      # Tar preserves executable permissions and template/.gitignore across jobs.
      - name: Archive build output
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python -c 'import os, tarfile; archive = tarfile.open(os.environ["PLATFORM"] + ".tar", "w"); archive.add("dist", arcname="dist"); archive.close()'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: ${{ matrix.platform }}.tar
          compression-level: 0
          if-no-files-found: error

  docs:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        env:
          DEFLORTA_DOCS_VERSION: ${{ needs.prepare.outputs.tag }}
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  release:
    needs: [prepare, build, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Assemble complete platform distributions
        run: python scripts/release.py package "$RELEASE_TAG" artifacts release-assets
      - name: Verify combined exports
        run: |
          sudo apt-get update
          sudo apt-get install -y libspeechd2 libdbus-1-3 libasound2t64 libudev1
          cli="artifacts/linux-x86_64/dist/deflorta"
          "$cli" create smoke-game
          "$cli" publish smoke-game --platform windows-x86_64 -o cross-export
      - name: Publish GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

  pages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
