[workspace]
resolver = "3"
members = ["crates/data", "crates/engine", "crates/cli", "crates/launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
deflorta = { path = "crates/engine" }
deflorta-data = { path = "crates/data" }
clap = { version = "4.6.7", features = ["derive"] }
lz4r = "1.10.0"
anyhow = "1.0.104"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oxc = { version = "0.153.0", features = ["minifier", "codegen", "semantic", "ast_visit"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
