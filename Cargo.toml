[package]
name = "deflorta"
version = "0.1.0"
edition = "2024"
description = "A visual novel engine scripted in JavaScript"
license = "MIT"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
struct_field_names = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
mozjs = "0.26.7"
winit = "0.30.13"
wgpu = { version = "30.0.1", features = ["spirv"] }
glyphon = "0.12.0"
taffy = "0.14.0"
image = "0.25.10"
kira = { version = "0.12.5", features = [ "aac", "isomp4", "mkv" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
bytemuck = { version = "1.25.2", features = [ "derive" ] }
pollster = "1.0.1"
dirs = "7.0.0"
anyhow = "1.0.104"
openh264 = "0.9.8"
mp4 = "0.14.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv"] }
oxideav-vp8 = { version = "0.2.7", default-features = false }
oxideav-vp9 = "0.0.13"
yuv = "0.8.19"
gilrs = "0.11.2"
log = "0.4.34"
pretty_env_logger = "0.5.0"
num-traits = "0.2.19"

[build-dependencies]
anyhow = "1.0.104"
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
oxc = { version = "0.153.0", features = ["minifier", "codegen"] }
