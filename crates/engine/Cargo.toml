[package]
name = "deflorta"
description = "A visual novel engine scripted in JavaScript"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mozjs = "0.26.7"
winit = "0.30.13"
wgpu = { version = "30.0.1", features = ["spirv"] }
glyphon = "0.12.0"
taffy = "0.14.0"
image = "0.25.10"
kira = { version = "0.12.5", features = [ "aac", "isomp4", "mkv" ] }
serde.workspace = true
serde_json.workspace = true
bytemuck = { version = "1.25.2", features = [ "derive" ] }
pollster = "1.0.1"
dirs = "7.0.0"
anyhow.workspace = true
openh264 = "0.9.8"
mp4 = "0.14.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv"] }
oxideav-vp8 = { version = "0.2.7", default-features = false }
oxideav-vp9 = "0.0.13"
yuv = "0.8.19"
gilrs = "0.11.2"
log.workspace = true
pretty_env_logger = "0.5.0"
num-traits = "0.2.19"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "checked-decode"] }

[build-dependencies]
anyhow.workspace = true
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
oxc.workspace = true
