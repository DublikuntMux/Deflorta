[package]
name = "deflorta-launcher-android"
description = "Android export runtime for Deflorta games"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "deflorta"
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
debug-formats = ["deflorta/debug-formats"]

[target.'cfg(target_os = "android")'.dependencies]
deflorta.workspace = true
anyhow.workspace = true
log.workspace = true
android_logger.workspace = true
winit = { workspace = true, features = ["android-game-activity"] }
