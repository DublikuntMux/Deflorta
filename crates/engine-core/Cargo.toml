[package]
name = "deflorta-engine-core"
description = "Deflorta engine coordination, rendering, and diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
dev-console = ["dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:sysinfo", "dep:pretty_env_logger", "wgpu/counters", "deflorta-assets/dev-console", "deflorta-ui/dev-console", "deflorta-js-bridge/dev-console"]

[dependencies]
deflorta-assets.workspace = true
image.workspace = true
egui = { workspace = true, optional = true }
egui-winit = { workspace = true, features = ["clipboard", "wayland", "x11"], optional = true }
egui-wgpu = { workspace = true, optional = true }
sysinfo = { workspace = true, features = ["system"], optional = true }
winit.workspace = true
accesskit.workspace = true
tts.workspace = true
wgpu.workspace = true
glyphon.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
anyhow.workspace = true
log.workspace = true
pretty_env_logger = { workspace = true, optional = true }
num-traits.workspace = true
deflorta-common.workspace = true
deflorta-ui.workspace = true
deflorta-js-bridge.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }

[build-dependencies]
anyhow.workspace = true
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
deflorta-script-build.workspace = true
tempfile.workspace = true
serde_json.workspace = true
pollster.workspace = true
